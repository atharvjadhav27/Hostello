services:
  # ========== 1. FRONTEND (React + nginx) ==========
  frontend:
    build:
      context: ./frontend          # folder that contains the Dockerfile
      args:
        VITE_API_URL: /api
    container_name: hostello-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"   # your PC's port 8080 → container port 80
    depends_on:
      - backend
    networks:
      - frontend
    restart: unless-stopped

  # ========== 2. BACKEND (Express API) ==========
  backend:
    build: ./backend
    container_name: hostello-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"  # optional, lets you test the API with Postman
    environment:
      PORT: 5000
      # "mongo" below is the database service's name, used as its address
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads:/app/public/uploads   # keeps uploaded files
    depends_on:
      mongo:
        condition: service_healthy    # wait until MongoDB is really ready
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ========== 3. DATABASE (MongoDB) ==========
  mongo:
    image: mongo:7                    # official image, no Dockerfile needed
    container_name: hostello-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db           # keeps the database files
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend                       # only the backend can reach it; no ports published
    restart: unless-stopped

# Named volumes: Docker stores these, and they survive container restarts
volumes:
  mongo-data:
  uploads:

# Two separate networks: frontend <-> backend, and backend <-> database
networks:
  frontend:
  backend: