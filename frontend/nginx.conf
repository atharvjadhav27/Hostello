server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow 5 MB uploads (the backend's limit)
    client_max_body_size 6m;

    # Send API calls and uploaded files to the backend container.
    # "backend" is the service name from compose.yaml; Docker turns it into an address.
    location /api/     { proxy_pass http://backend:5000; }
    location /uploads/ { proxy_pass http://backend:5000; }

    # React Router: any other path loads index.html (so refreshing /admin/dashboard works)
    location / {
        try_files $uri $uri/ /index.html;
    }
}